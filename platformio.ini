[env:cardputer-adv]
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
lib_ignore =
    ESP32 BLE Keyboard
    ESP32 BLE Arduino
lib_deps =
    m5stack/M5Unified @ 0.2.22
    m5stack/M5Cardputer @ 1.1.1
    bblanchon/ArduinoJson @ 7.4.3
    ewpa/LibSSH-ESP32 @ 5.9.0
    z3t0/IRremote @ 4.7.1
    h2zero/NimBLE-Arduino @ 1.4.3
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCORE_DEBUG_LEVEL=1

[platformio]
default_envs = cardputer-adv
